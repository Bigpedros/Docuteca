name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Verify self-hosted OCR assets
        run: |
          test -s public/recognizer-b/ocrs_wasm.js
          test -s public/recognizer-b/ocrs_wasm_bg.wasm
          test -s public/models/text-detection.rten
          test -s public/models/text-recognition.rten
          test -s public/tesseract/worker.min.js
          test -s public/tesseract/core/tesseract-core.wasm.js
          test -s public/tesseract/core/tesseract-core-simd.wasm.js
          test -s public/tesseract/core/tesseract-core-lstm.wasm.js
          test -s public/tesseract/core/tesseract-core-simd-lstm.wasm.js
          test -s public/tesseract/lang/ita.traineddata.gz
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
